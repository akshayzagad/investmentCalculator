<div class="row">
  <div class="col-md-3"></div>
  <div class="col-md-6 postion">
    <table class="table table-striped table-bordered text-center mt-4">
      <thead class="table-dark">
        <tr>
          <th>Year</th>
          <th>Invested Value</th>
          <th>Interest (Year)</th>
          <th>Total Interest</th>
          <th>Invested Capital</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let res of calculation">
          <td>{{ res.year }}</td>
          <td>₹{{ res.investedValue | number : '1.0-0' }}</td>
          <td>₹{{ res.interestEarned | number : '1.0-0' }}</td>
          <td>₹{{ res.totalInterest | number : '1.0-0' }}</td>
          <td>₹{{ res.investedCapital | number : '1.0-0' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="col-md-3"></div>
</div>
